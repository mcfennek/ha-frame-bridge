name: The Frame Bridge
version: "0.5.0"
slug: frame_bridge
description: Bildergalerie, Upload und REST-API für Samsung The Frame
url: https://github.com/mcfennek/ha-frame-bridge
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
panel_title: The Frame
homeassistant_api: true
watchdog: "http://[HOST]:[PORT:8099]/health"
backup: hot
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Externe REST-API (nur aktiv, wenn api_enabled gesetzt ist)
options:
  tv_host: ""
  media_player_entity: ""
  api_enabled: false
  max_upload_mb: 25
  matte: none
  log_level: info
  public_url: ""
  ai_matte: modernthin_warm
schema:
  tv_host: str?
  media_player_entity: str?
  api_enabled: bool
  max_upload_mb: int(1,100)
  matte: str
  log_level: list(debug|info|warning|error)
  public_url: str?
  ai_matte: str
